name: Astro PR Build

on:
  pull_request:
    paths:
      - 'astro-site/**'
      - '.github/workflows/astro-pr.yml'
  push:
    branches: [feat/astro-migration]
    paths:
      - 'astro-site/**'
      - '.github/workflows/astro-pr.yml'

defaults:
  run:
    working-directory: astro-site

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-dist
          path: astro-site/dist/
          retention-days: 14

      - name: Verify page count
        run: |
          # Sanity check: every publisher + every doc type + content pages
          # The current expected floor is 200+ pages (26 publishers × ~10 doctypes).
          PAGE_COUNT=$(find dist -name "*.html" | wc -l)
          echo "HTML pages built: $PAGE_COUNT"
          if [ "$PAGE_COUNT" -lt 200 ]; then
            echo "::error::Expected ≥200 pages, got $PAGE_COUNT — a routing module is broken"
            exit 1
          fi
