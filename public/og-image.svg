<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a56db"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect y="580" width="1200" height="50" fill="url(#accent)" opacity="0.8"/>
  <!-- Logo -->
  <rect x="480" y="80" width="60" height="60" rx="12" fill="#1a56db"/>
  <text x="510" y="122" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="36" fill="white">P</text>
  <!-- Title -->
  <text x="600" y="210" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="72" fill="white">PubID</text>
  <!-- Tagline -->
  <text x="600" y="270" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="28" fill="#94a3b8">Universal Publication Identifier</text>
  <!-- Example identifier -->
  <rect x="250" y="320" width="700" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="360" text-anchor="middle" font-family="monospace" font-size="26" fill="#e2e8f0">
    <tspan fill="#1a56db">ISO</tspan><tspan fill="#64748b">/</tspan><tspan fill="#059669">IEC</tspan><tspan fill="#64748b"> </tspan><tspan fill="#e2e8f0">27001</tspan><tspan fill="#64748b">:</tspan><tspan fill="#f59e0b">2022</tspan><tspan fill="#64748b">/</tspan><tspan fill="#ef4444">Amd 1</tspan>
  </text>
  <!-- Subtitle -->
  <text x="600" y="440" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="20" fill="#64748b">Parse, validate, and interoperate identifiers for 23+ standards publishers</text>
  <!-- Bottom bar text -->
  <text x="600" y="612" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="600" font-size="18" fill="white">pubid.com — Open Source · Ruby Gem · URN Standard</text>
</svg>
